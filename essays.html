<body class="bg-surface font-body antialiased text-blue-900 min-h-screen relative overflow-x-hidden">
    <!-- THEME BACKGROUND -->
    <div class="fixed inset-0 z-0 pointer-events-none overflow-hidden transition-colors duration-700 app-bg-container" style="background-color: #F8FAFC;">
        <!-- Main top gradient -->
        <div class="absolute inset-0 app-bg-top" style="background: linear-gradient(135deg, rgba(59, 130, 246, 0.05) 0%, transparent 100%);"></div>
        <!-- Soft glow bottom right -->
        <div class="absolute -bottom-40 -right-40 w-[600px] h-[600px] rounded-full mix-blend-multiply opacity-40 animate-[pulse_6s_ease-in-out_infinite]" style="background: radial-gradient(circle, rgba(96, 165, 250, 0.4) 0%, transparent 70%);"></div>
        <!-- Soft glow top left -->
        <div class="absolute -top-40 -left-40 w-[500px] h-[500px] rounded-full mix-blend-multiply opacity-30 animate-[pulse_8s_ease-in-out_infinite_reverse]" style="background: radial-gradient(circle, rgba(59, 130, 246, 0.3) 0%, transparent 70%);"></div>
    </div>

    <!-- Shared Navbar injected by JS -->

    <!-- ════════════════════════════════════════════════
         SAAS SPLIT LAYOUT
    ════════════════════════════════════════════════ -->
    <main class="relative z-10 w-full max-w-7xl mx-auto px-6 py-24 lg:py-32 flex flex-col lg:flex-row gap-10 items-start">

        <!-- Left Sidebar (Sticky) -->
        <aside class="w-full lg:w-1/3 flex-shrink-0 lg:sticky lg:top-32 flex flex-col gap-5">

            <!-- Navigation elements moved OUTSIDE the card -->
            <div class="flex items-center gap-4 px-2 mb-2">
                <a href="javascript:history.back()" class="inline-flex items-center gap-2 text-blue-700 font-bold text-sm hover:text-blue-900 transition-all group px-4 py-2 rounded-full bg-white/40 backdrop-blur-xl border border-white/60 shadow-[0_4px_15px_rgba(0,0,0,0.03)] hover:shadow-[0_8px_20px_rgba(59,130,246,0.1)] hover:-translate-y-0.5">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 transition-transform group-hover:-translate-x-1" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
                    Back
                </a>
                <div class="inline-flex items-center px-4 py-2.5 rounded-full bg-white/40 backdrop-blur-xl border border-white/60 shadow-[0_4px_15px_rgba(0,0,0,0.03)] text-blue-700 text-[10px] font-extrabold uppercase tracking-[0.2em]">
                    Essays
                </div>
            </div>

            <!-- The Main Card -->
            <div class="bg-white/60 backdrop-blur-[40px] border border-white/80 shadow-[0_30px_60px_-10px_rgba(59,130,246,0.15),inset_0_1px_0_rgba(255,255,255,0.8)] rounded-[3rem] p-8 lg:p-12 relative flex flex-col items-center text-center transition-all duration-500 hover:shadow-[0_40px_80px_-15px_rgba(59,130,246,0.2),inset_0_1px_0_rgba(255,255,255,0.8)] hover:-translate-y-1 overflow-hidden">
                <!-- Decorative Glow inside sidebar -->
                <div class="absolute inset-0 overflow-hidden rounded-[3rem] pointer-events-none">
                    <div class="absolute top-0 right-0 w-48 h-48 bg-blue-400/20 rounded-full blur-[40px] pointer-events-none -translate-y-1/2 translate-x-1/2"></div>
                    <div class="absolute bottom-0 left-0 w-40 h-40 bg-sky-400/20 rounded-full blur-[40px] pointer-events-none translate-y-1/2 -translate-x-1/2"></div>
                </div>

                <!-- Circular Icon -->
                <div class="relative w-32 h-32 mb-6 rounded-full bg-white/80 border border-white shadow-[0_8px_30px_rgba(59,130,246,0.15)] flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-16 h-16 text-blue-500 drop-shadow-md" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                    </svg>
                </div>

                <!-- Subject Info -->
                <h1 class="font-heading text-[2.5rem] lg:text-4xl font-extrabold text-blue-950 mb-5 leading-none tracking-tight" style="text-shadow: 0 4px 15px rgba(59, 130, 246, 0.1);">Doctor Essays</h1>

                <p class="text-slate-500/90 text-[0.95rem] leading-relaxed mb-10 font-medium px-2">Academic essays and analyses from your professors.</p>

                <!-- Lectures Count -->
                <div class="w-full flex items-center justify-center gap-3 text-xs text-blue-700 font-bold bg-white/50 py-4 px-5 rounded-[1.25rem] border border-white/60 shadow-[0_8px_20px_rgba(59,130,246,0.06)] transition-all hover:bg-white/70">
                    <svg class="w-4 h-4 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" /></svg>
                    <span class="tracking-wide"><span id="essays-count">0</span> Essays Available</span>
                </div>
            </div>
        </aside>

        <!-- Right Content (Chapters) -->
        <div class="w-full lg:w-2/3">
            <div id="essays-grid" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- injected by JS -->
            </div>
        </div>

    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/sync.js"></script>
    <script src="js/shared-nav.js"></script>
