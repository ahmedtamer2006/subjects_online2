<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Material — Subjects Online</title>
    <script src="js/page-transition.js"></script>
    <script defer src="https://cloud.umami.is/script.js" data-website-id="c19193c1-aaf3-477d-acd2-56be26abe5ec"></script>
    <link rel="stylesheet" href="css/tailwind-utilities.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/mobile-perf.css">
    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0ea5e9">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Subjects Online">
    <link rel="apple-touch-icon" href="images/icon-512.png">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #f0f9ff; }
        ::-webkit-scrollbar-thumb { background: #7dd3fc; border-radius: 999px; }

        body {
            background: #F0F9FF;
            font-family: 'Inter', system-ui, sans-serif;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ── HERO ── */
        .browse-hero {
            position: relative;
            padding: 120px 2rem 80px;
            text-align: center;
            overflow: hidden;
        }

        .browse-hero::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse 80% 60% at 50% -10%, rgba(14,165,233,0.15) 0%, transparent 70%),
                radial-gradient(ellipse 40% 40% at 80% 100%, rgba(56,189,248,0.1) 0%, transparent 70%);
            pointer-events: none;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 16px;
            background: rgba(14,165,233,0.08);
            border: 1px solid rgba(14,165,233,0.2);
            border-radius: 999px;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #0EA5E9;
            margin-bottom: 1.5rem;
        }

        .hero-badge-dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: #0EA5E9;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.3); }
        }

        /* ── ULTRA-LUXURY BROWSE HEADER CARD ── */
        .browse-header-card {
            position: relative;
            width: 100%;
            max-width: 1050px;
            background: rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(40px) saturate(220%);
            -webkit-backdrop-filter: blur(40px) saturate(220%);
            border: 1px solid rgba(14, 165, 233, 0.28);
            border-radius: 2.75rem;
            padding: 3.5rem 3rem;
            box-shadow:
                0 30px 70px -15px rgba(14, 165, 233, 0.2),
                0 0 0 1px rgba(255, 255, 255, 0.9) inset,
                inset 0 2px 4px rgba(255, 255, 255, 0.8);
            text-align: left;
            transition: all 0.45s cubic-bezier(0.16, 1, 0.3, 1);
            margin: 0 auto;
            overflow: hidden;
        }

        html.dark-mode .browse-header-card {
            background: rgba(10, 18, 36, 0.88);
            border-color: rgba(56, 189, 248, 0.25);
            box-shadow:
                0 35px 80px -15px rgba(0, 0, 0, 0.75),
                0 0 0 1px rgba(255, 255, 255, 0.08) inset,
                inset 0 1px 2px rgba(255, 255, 255, 0.05);
        }

        .browse-header-card:hover {
            transform: translateY(-5px);
            border-color: rgba(14, 165, 233, 0.45);
            box-shadow:
                0 40px 90px -15px rgba(14, 165, 233, 0.28),
                0 0 0 1px rgba(255, 255, 255, 1) inset;
        }

        /* Ambient interior glows */
        .card-ambient-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            pointer-events: none;
            z-index: 0;
        }
        .orb-sky {
            width: 300px; height: 300px;
            top: -100px; right: -80px;
            background: radial-gradient(circle, rgba(14, 165, 233, 0.18) 0%, transparent 70%);
        }
        .orb-indigo {
            width: 250px; height: 250px;
            bottom: -80px; left: 10%;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.14) 0%, transparent 70%);
        }

        .browse-card-inner {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 2rem;
        }

        @media (min-width: 768px) {
            .browse-card-inner {
                flex-direction: row;
                text-align: left;
                align-items: center;
                gap: 2.75rem;
            }
        }

        /* 3D Master Icon Box */
        .browse-icon-master-box {
            position: relative;
            width: 100px;
            height: 100px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .browse-icon-halo-glow {
            position: absolute;
            inset: -10px;
            border-radius: 2rem;
            background: radial-gradient(circle, rgba(14, 165, 233, 0.45) 0%, transparent 70%);
            filter: blur(15px);
            animation: iconHaloPulse 3s ease-in-out infinite alternate;
        }

        @keyframes iconHaloPulse {
            0% { transform: scale(0.9); opacity: 0.5; }
            100% { transform: scale(1.15); opacity: 0.9; }
        }

        .browse-icon-glass-circle {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 2rem;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.9) 0%, rgba(224, 242, 254, 0.7) 100%);
            border: 1.5px solid rgba(14, 165, 233, 0.35);
            box-shadow:
                0 15px 35px rgba(14, 165, 233, 0.25),
                inset 0 2px 4px rgba(255, 255, 255, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        html.dark-mode .browse-icon-glass-circle {
            background: linear-gradient(135deg, rgba(14, 165, 233, 0.25) 0%, rgba(15, 23, 42, 0.8) 100%);
            border-color: rgba(56, 189, 248, 0.4);
            box-shadow:
                0 15px 35px rgba(0, 0, 0, 0.5),
                inset 0 1px 2px rgba(255, 255, 255, 0.15);
        }

        .browse-header-card:hover .browse-icon-glass-circle {
            transform: scale(1.1) rotate(6deg);
        }

        .browse-card-text-col {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        @media (min-width: 768px) {
            .browse-card-text-col {
                align-items: flex-start;
            }
        }

        .browse-header-title {
            font-family: 'Plus Jakarta Sans', Inter, system-ui, sans-serif;
            font-size: clamp(2.75rem, 6vw, 4.5rem);
            font-weight: 900;
            line-height: 1.08;
            letter-spacing: -0.035em;
            margin-bottom: 0.75rem;
        }

        .word-browse {
            color: #0f172a;
            margin-right: 0.6rem;
        }

        html.dark-mode .word-browse {
            color: #ffffff;
        }

        .word-material {
            color: #0ea5e9;
        }

        html.dark-mode .word-material {
            color: #38bdf8;
        }

        .browse-header-subtitle {
            font-size: clamp(0.95rem, 2vw, 1.15rem);
            color: #475569;
            font-weight: 500;
            line-height: 1.6;
            max-width: 580px;
        }

        html.dark-mode .browse-header-subtitle {
            color: #94a3b8;
        }

        @media (max-width: 640px) {
            .browse-header-card {
                padding: 2.25rem 1.5rem;
                border-radius: 2rem;
            }
            .browse-icon-master-box {
                width: 80px;
                height: 80px;
            }
        }

        /* ── SEARCH BAR ── */
        .search-wrap {
            position: relative;
            max-width: 500px;
            margin: 0 auto;
        }

        .search-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #94A3B8;
            pointer-events: none;
        }

        /* .search-input {
            width: 100%;
            padding: 14px 20px 14px 50px;
            background: #FFFFFF;
            border: 1.5px solid rgba(14,165,233,0.2);
            border-radius: 16px;
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            color: #0C1A2E;
            outline: none;
            transition: all 0.2s;
            box-shadow: 0 4px 20px rgba(14,165,233,0.06);
        } */

        /* .search-input::placeholder { color: #94A3B8; }

        .search-input:focus {
            border-color: #0EA5E9;
            box-shadow: 0 0 0 4px rgba(14,165,233,0.1), 0 4px 20px rgba(14,165,233,0.1);
        } */

        /* ── GRID ── */
        .material-grid-wrap {
            max-width: 1100px;
            margin: 0 auto;
            padding: 3rem 2rem 6rem;
        }

        .grid-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 2.5rem;
        }

        .grid-header-line {
            flex: 1;
            max-width: 120px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(14, 165, 233, 0.3), transparent);
        }

        .grid-count {
            font-size: 0.75rem;
            font-weight: 700;
            color: #0EA5E9;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            padding: 8px 22px;
            background: linear-gradient(135deg, rgba(14, 165, 233, 0.06), rgba(56, 189, 248, 0.04));
            border: 1px solid rgba(14, 165, 233, 0.15);
            border-radius: 999px;
            white-space: nowrap;
            position: relative;
            box-shadow: 0 2px 12px rgba(14, 165, 233, 0.06);
        }

        #material-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        /* ── PREMIUM CARD ── */
        .material-card {
            position: relative;
            background: #ffffff;
            border-radius: 24px;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            text-decoration: none;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            border: 1px solid rgba(0,0,0,0.04);
            box-shadow: 0 10px 40px -10px rgba(0,0,0,0.03);
            overflow: hidden;
            isolation: isolate;
        }

        .material-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px -10px rgba(0,0,0,0.08), 0 0 20px rgba(0,0,0,0.02);
            border-color: rgba(0,0,0,0.08);
        }

        .material-card:hover .glow-orb {
            transform: scale(1.5) translate(-10%, 10%);
        }

        .material-card:hover .card-icon {
            transform: scale(1.1) rotate(-6deg);
            box-shadow: 0 12px 20px rgba(0,0,0,0.1);
        }

        .material-card:hover .card-title {
            color: #0EA5E9 !important;
        }

        .card-inner {
            padding: 1.75rem 1.75rem 1.5rem;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        /* Action buttons */
        .action-btn {
            width: 30px; height: 30px;
            border-radius: 10px;
            background: rgba(0,0,0,0.03);
            border: 1px solid rgba(0,0,0,0.06);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #CBD5E1;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .action-btn:hover {
            background: rgba(14,165,233,0.1);
            border-color: rgba(14,165,233,0.4);
            color: #0EA5E9;
        }

        /* Content */
        .card-title {
            font-family: 'Plus Jakarta Sans', serif;
            font-size: 1.25rem;
            font-weight: 800;
            color: #0C1A2E;
            line-height: 1.25;
            margin-bottom: 0.4rem;
            transition: color 0.2s;
        }

        .card-desc {
            font-size: 0.85rem;
            color: #64748B;
            line-height: 1.65;
            flex: 1;
            margin-bottom: 1.5rem;
        }

        .icon-arrow {
            transition: all 0.3s;
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 5rem 2rem;
            color: #94A3B8;
        }

        .empty-state svg {
            width: 64px; height: 64px;
            margin: 0 auto 1rem;
            opacity: 0.3;
        }

        .empty-state p {
            font-size: 1rem;
            font-weight: 500;
        }

        @media (max-width: 640px) {
            .browse-hero { padding: 100px 1.25rem 20px; }
            .material-grid-wrap { padding: 2rem 1.25rem 4rem; }
            #material-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>

<body>
    <!-- Shared Navbar injected by JS -->

    <!-- Hero Section -->
    <section class="browse-hero relative z-10 w-full max-w-6xl mx-auto px-4 sm:px-6">
        <div class="browse-header-card">
            <!-- Background Orbs inside Card -->
            <div class="card-ambient-orb orb-sky" aria-hidden="true"></div>
            <div class="card-ambient-orb orb-indigo" aria-hidden="true"></div>

            <div class="browse-card-inner">
                <!-- 3D Master Custom Icon -->
                <div class="browse-icon-master-box">
                    <div class="browse-icon-halo-glow" aria-hidden="true"></div>
                    <div class="browse-icon-glass-circle">
                        <svg width="50" height="50" viewBox="0 0 52 52" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <rect width="52" height="52" rx="18" fill="url(#icon_grad_bg)"/>
                            <path d="M14 35.5C14 33.0147 16.0147 31 18.5 31H38V12H18.5C16.0147 12 14 14.0147 14 16.5V35.5Z" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M14 35.5C14 37.9853 16.0147 40 18.5 40H38" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M22 20H31M22 25H27" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
                            <defs>
                                <linearGradient id="icon_grad_bg" x1="0" y1="0" x2="52" y2="52" gradientUnits="userSpaceOnUse">
                                    <stop stop-color="#0EA5E9"/>
                                    <stop offset="0.5" stop-color="#3B82F6"/>
                                    <stop offset="1" stop-color="#6366F1"/>
                                </linearGradient>
                            </defs>
                        </svg>
                    </div>
                </div>

                <!-- Text & Titles -->
                <div class="browse-card-text-col">
                    <h1 class="browse-header-title">
                        <span class="word-browse">Browse</span><span class="word-material">Material</span>
                    </h1>

                    <p class="browse-header-subtitle">
                        Explore all university modules, lecture summaries, chapter decks, and doctor notes.
                    </p>
                </div>
            </div>
        </div>
    </section>

    <!-- Cards Grid -->
    <div class="material-grid-wrap relative z-10">
        <div class="grid-header">
            <div class="grid-header-line"></div>
            <span class="grid-count" id="grid-count">—</span>
            <div class="grid-header-line"></div>
        </div>
        <div id="material-grid">
            <!-- injected by JS -->
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <!-- Firebase SDK & Sync -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/sync.js"></script>
    <script src="js/shared-nav.js"></script>
    <script src="js/premium-effects.js"></script>
    <script src="js/data.js"></script>
    <script src="js/browse.js"></script>
    <script src="js/pwa.js"></script>

    <script>
        // Live search filter
        document.addEventListener('DOMContentLoaded', () => {
            const searchInput = document.getElementById('search-input');
            if (!searchInput) return;
            searchInput.addEventListener('input', () => {
                const q = searchInput.value.toLowerCase();
                document.querySelectorAll('.material-card').forEach(card => {
                    const title = card.querySelector('.card-title')?.textContent.toLowerCase() || '';
                    const desc = card.querySelector('.card-desc')?.textContent.toLowerCase() || '';
                    card.style.display = (title.includes(q) || desc.includes(q)) ? '' : 'none';
                });
            });
        });
    </script>
</body>
</html>
