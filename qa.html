<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questions & Answers — Subjects Online</title>
    <script src="js/page-transition.js"></script>
    <script defer src="https://cloud.umami.is/script.js" data-website-id="c19193c1-aaf3-477d-acd2-56be26abe5ec"></script>
    <link rel="stylesheet" href="css/tailwind-utilities.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/welcome.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/chapters.css">
    <link rel="stylesheet" href="css/mobile-perf.css">
    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d1b3e">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Subjects Online">
    <link rel="apple-touch-icon" href="images/icon-512.png"></head>
<body class="bg-surface font-body antialiased text-amber-900 min-h-screen relative overflow-x-hidden">

    <!-- THEME BACKGROUND -->
    <div class="fixed inset-0 z-0 pointer-events-none overflow-hidden transition-colors duration-700 app-bg-container" style="background-color: #FFFBEB;">
        <!-- Main top gradient -->
        <div class="absolute inset-0 app-bg-top" style="background: linear-gradient(135deg, rgba(245, 158, 11, 0.05) 0%, transparent 100%);"></div>
        <!-- Soft glow bottom right -->
        <div class="absolute -bottom-40 -right-40 w-[600px] h-[600px] rounded-full mix-blend-multiply opacity-40 animate-[pulse_6s_ease-in-out_infinite]" style="background: radial-gradient(circle, rgba(251, 191, 36, 0.4) 0%, transparent 70%);"></div>
        <!-- Soft glow top left -->
        <div class="absolute -top-40 -left-40 w-[500px] h-[500px] rounded-full mix-blend-multiply opacity-30 animate-[pulse_8s_ease-in-out_infinite_reverse]" style="background: radial-gradient(circle, rgba(245, 158, 11, 0.3) 0%, transparent 70%);"></div>
    </div>

    <!-- Navbar injected by JS -->

    <!-- ════════════════════════════════════════════════
         SAAS SPLIT LAYOUT
    ════════════════════════════════════════════════ -->
    <main class="relative z-10 w-full max-w-7xl mx-auto px-6 py-24 lg:py-32 flex flex-col lg:flex-row gap-10 items-start">

        <!-- Left Sidebar (Sticky) -->
        <aside class="w-full lg:w-1/3 flex-shrink-0 lg:sticky lg:top-32 flex flex-col gap-5">

            <!-- Navigation elements moved OUTSIDE the card -->
            <div class="flex items-center gap-4 px-2 mb-2">
                <a href="javascript:history.back()" class="inline-flex items-center gap-2 text-amber-700 font-bold text-sm hover:text-amber-900 transition-all group px-4 py-2 rounded-full bg-white/40 backdrop-blur-xl border border-white/60 shadow-[0_4px_15px_rgba(0,0,0,0.03)] hover:shadow-[0_8px_20px_rgba(245,158,11,0.1)] hover:-translate-y-0.5">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 transition-transform group-hover:-translate-x-1" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
                    Back
                </a>
                <div class="inline-flex items-center px-4 py-2.5 rounded-full bg-white/40 backdrop-blur-xl border border-white/60 shadow-[0_4px_15px_rgba(0,0,0,0.03)] text-amber-700 text-[10px] font-extrabold uppercase tracking-[0.2em]">
                    Questions & Answers
                </div>
            </div>

            <!-- The Main Card -->
            <div class="bg-white/60 backdrop-blur-[40px] border border-white/80 shadow-[0_30px_60px_-10px_rgba(245,158,11,0.15),inset_0_1px_0_rgba(255,255,255,0.8)] rounded-[3rem] p-8 lg:p-12 relative flex flex-col items-center text-center transition-all duration-500 hover:shadow-[0_40px_80px_-15px_rgba(245,158,11,0.2),inset_0_1px_0_rgba(255,255,255,0.8)] hover:-translate-y-1">
                <!-- Decorative Glow inside sidebar -->
                <div class="absolute inset-0 overflow-hidden rounded-[3rem] pointer-events-none">
                    <div class="absolute top-0 right-0 w-48 h-48 bg-amber-400/20 rounded-full blur-[40px] pointer-events-none -translate-y-1/2 translate-x-1/2"></div>
                    <div class="absolute bottom-0 left-0 w-40 h-40 bg-yellow-400/20 rounded-full blur-[40px] pointer-events-none translate-y-1/2 -translate-x-1/2"></div>
                </div>

                <!-- Circular Progress Bar -->
                <div class="relative w-36 h-36 mb-6" id="progress-ring-wrapper" style="cursor:pointer">
                    <!-- SVG Circle -->
                    <svg class="w-full h-full transform -rotate-90 drop-shadow-xl" viewBox="0 0 100 100">
                        <!-- Background Track -->
                        <circle cx="50" cy="50" r="42" fill="none" stroke="rgba(245, 158, 11, 0.1)" stroke-width="8" />
                        <!-- Progress Track -->
                        <circle id="circular-progress-bar" cx="50" cy="50" r="42" fill="none" stroke="url(#progress-gradient)" stroke-width="8" stroke-linecap="round" stroke-dasharray="264" stroke-dashoffset="264" class="transition-all duration-1000 ease-out drop-shadow-[0_4px_10px_rgba(245,158,11,0.5)]" />
                        <defs>
                            <linearGradient id="progress-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
                                <stop offset="0%" stop-color="#f59e0b" />
                                <stop offset="100%" stop-color="#fbbf24" />
                            </linearGradient>
                        </defs>
                    </svg>
                    <!-- Center Content (Progress Percentage) -->
                    <div class="absolute inset-0 flex flex-col items-center justify-center">
                        <span id="progress-text-circle" class="text-3xl font-heading font-bold text-amber-950">0%</span>
                        <span class="text-[9px] uppercase tracking-wider text-amber-500 font-bold mt-1">Completed</span>
                    </div>
                    <!-- Hover Breakdown Tooltip -->
                    <div id="progress-tooltip" style="
                        position: absolute; bottom: calc(100% + 12px); left: 50%; transform: translateX(-50%) scale(0.92);
                        background: rgba(255,255,255,0.97); backdrop-filter: blur(16px);
                        border: 1px solid rgba(245,158,11,0.15); border-radius: 16px;
                        padding: 12px 16px; min-width: 170px;
                        box-shadow: 0 12px 32px rgba(245,158,11,0.18), 0 2px 8px rgba(0,0,0,0.06);
                        opacity: 0; pointer-events: none;
                        transition: opacity 0.22s ease, transform 0.22s ease;
                        z-index: 100;
                    ">
                        <div style="font-size:10px;font-weight:800;letter-spacing:0.12em;text-transform:uppercase;color:#f59e0b;margin-bottom:10px;display:flex;align-items:center;gap:5px;">
                            <svg width="10" height="10" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 4a1 1 0 011-1h12a1 1 0 010 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 010 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 010 2H4a1 1 0 01-1-1z" clip-rule="evenodd"/></svg>
                            Breakdown
                        </div>
                        <div style="display:flex;flex-direction:column;gap:8px;">
                            <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;">
                                <div style="display:flex;align-items:center;gap:6px;">
                                    <div style="width:8px;height:8px;border-radius:50%;background:#ef4444;"></div>
                                    <span style="font-size:11px;color:#64748b;font-weight:500;">PDFs</span>
                                </div>
                                <span id="tooltip-pdfs" style="font-size:12px;font-weight:800;color:#0f172a;">0 / 0</span>
                            </div>
                            <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;">
                                <div style="display:flex;align-items:center;gap:6px;">
                                    <div style="width:8px;height:8px;border-radius:50%;background:#f59e0b;"></div>
                                    <span style="font-size:11px;color:#64748b;font-weight:500;">Videos</span>
                                </div>
                                <span id="tooltip-videos" style="font-size:12px;font-weight:800;color:#0f172a;">0 / 0</span>
                            </div>
                        </div>
                        <!-- Arrow -->
                        <div style="position:absolute;bottom:-7px;left:50%;transform:translateX(-50%) rotate(45deg);width:13px;height:13px;background:rgba(255,255,255,0.97);border-right:1px solid rgba(245,158,11,0.15);border-bottom:1px solid rgba(245,158,11,0.15);"></div>
                    </div>
                </div>

                <!-- Subject Info -->
                <h1 id="chap-subj-title" class="font-heading text-[2.5rem] lg:text-5xl font-extrabold text-amber-950 mb-5 leading-none tracking-tight" style="text-shadow: 0 4px 15px rgba(245, 158, 11, 0.1);">Loading...</h1>

                <!-- <p class="text-slate-500/90 text-[0.95rem] leading-relaxed mb-10 font-medium px-2">Practice with comprehensive question banks and step-by-step solutions.</p> -->

                <!-- Lectures Count -->
                <div class="w-full flex items-center justify-center gap-3 text-xs text-amber-700 font-bold bg-white/50 py-4 px-5 rounded-[1.25rem] border border-white/60 shadow-[0_8px_20px_rgba(245,158,11,0.06)] transition-all hover:bg-white/70">
                    <svg class="w-4 h-4 text-amber-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z"/></svg>
                    <span id="progress-count" class="tracking-wide">0 of 0 lectures completed</span>
                </div>
            </div>
        </aside>

        <!-- Right Content (Chapters) -->
        <div class="w-full lg:w-2/3">
            <div id="timeline-container" class="flex flex-col gap-6">
                <!-- Injected by JS -->
            </div>
        </div>

    </main>

    <!-- Firebase SDK & Sync -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/sync.js"></script>
    <script src="js/shared-nav.js"></script>
    <script src="js/premium-effects.js"></script>
    <script src="js/data.js?v=3"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="js/qa.js?v=3"></script>
    <script src="js/pwa.js"></script>
</body>
</html>
